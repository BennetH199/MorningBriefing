name: Morgenbriefing

on:
  schedule:
    # Zeiten sind UTC. Zwei bis drei Versuche decken Sommer-/Winterzeit ab
    # (Berlin = UTC+2 bzw. UTC+1) und fangen Verspätungen oder Fehler ab.
    # Das Skript überspringt den Lauf, wenn das Briefing von heute schon vollständig vorliegt.
    - cron: '47 3 * * *'
    - cron: '47 4 * * *'
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      check_feeds:
        description: 'Nur Feeds testen (keine API-Kosten, nichts wird veröffentlicht)'
        type: boolean
        default: false

concurrency:
  group: briefing
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests (offline)
        run: python -m unittest discover tests

      - name: Briefing erstellen
        run: python build_briefing.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHECK_FEEDS: ${{ inputs.check_feeds }}

      - name: Daten ins Repository schreiben
        if: ${{ !inputs.check_feeds }}
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "Keine Änderungen." || (git commit -m "Briefing $(TZ=Europe/Berlin date +%F)" && git push)

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.check_feeds }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.check_feeds }}
        with:
          path: docs

  deploy:
    needs: build
    if: ${{ !inputs.check_feeds }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
